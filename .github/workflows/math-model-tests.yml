name: Mathematical model tests

on:
  push:
    branches: [main, "math-model-v2"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-math.txt
      - run: python -m pip install -r requirements-math.txt
      - run: python -m pytest -q
